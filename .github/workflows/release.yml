name: Package and release

on:
  push:
    tags:
      - '**'

env:
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packages@v2
